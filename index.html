                opts: ["(A) 10秒", "(B) 20秒", "(C) 26秒", "(D) 32秒"],
                ans: 1,
                exp: "從表格裡的數據找線索：<br>1. 40℃ 時花了 30 秒，50℃ 時花了 15 秒。<br>2. 45℃ 介於中間，時間一定介於 15秒 到 30秒 之間。<br>3. 比較反應速率（時間的倒數）：40℃ 速率約 0.033，50℃ 速率約 0.066。<br>4. 45℃ 的速率大約是中間值 (0.033+0.066)/2 ≈ 0.05。<br>5. 速率是 0.05，時間就是 1 ÷ 0.05 = 20 秒。所以 (B) 最合理！"
            }
        ];

        const { useState, useEffect } = React;

        const Header = () => (
            <header className="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-10 py-4 mb-6">
                <div className="max-w-4xl mx-auto px-4 flex items-center justify-center gap-3">
                    <span className="text-3xl">🧪</span>
                    <h1 className="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-500 to-green-500 tracking-wide">
                        八下理化：魔法補考測驗 2
                    </h1>
                    <span className="text-3xl">✨</span>
                </div>
            </header>
        );

        const QuestionCard = ({ item, index, selectedIdx, onSelect, isReviewMode }) => {
            const showResult = selectedIdx !== undefined && selectedIdx !== null;

            const handleSelect = (idx) => {
                if (!showResult) {
                    onSelect(item.id, idx, idx === item.ans);
                }
            };

            const createMarkup = (htmlStr) => {
                return { __html: htmlStr };
            };

            return (
                <div className="mb-10 w-full max-w-3xl mx-auto fade-in">
                    <div className="bg-white rounded-3xl shadow-[0_4px_20px_rgb(0,0,0,0.05)] overflow-hidden border border-gray-100">
                        {/* Question Header */}
                        <div className={`p-5 border-b border-gray-50 flex gap-3 ${isReviewMode ? 'bg-gradient-to-r from-rose-100 to-red-100' : 'bg-gradient-to-r from-blue-100 to-teal-100'}`}>
                            <div className={`flex-shrink-0 w-10 h-10 bg-white rounded-full flex items-center justify-center font-black shadow-sm text-lg ${isReviewMode ? 'text-rose-600' : 'text-teal-600'}`}>
                                {item.id}
                            </div>
                            <div className="text-lg font-bold text-gray-800 self-center leading-relaxed" 
                                 dangerouslySetInnerHTML={createMarkup(item.q)} />
                        </div>
                        
                        {/* Question Image */}
                        {item.img && (
                            <div className="p-4 bg-gray-50 flex justify-center border-b border-gray-100">
                                <img src={item.img} alt={`第${item.id}題圖片`} className="max-w-full h-auto max-h-64 object-contain img-shadow rounded-lg border-2 border-white" />
                            </div>
                        )}

                        {/* Options */}
                        <div className="p-5 space-y-3">
                            {item.opts.map((opt, idx) => {
                                const isSelected = selectedIdx === idx;
                                const isCorrect = idx === item.ans;
                                
                                let btnClass = "w-full text-left p-4 rounded-2xl border-2 transition-all duration-300 ease-out relative flex items-center gap-4 group ";
                                let icon = null;

                                if (!showResult) {
                                    btnClass += isReviewMode 
                                        ? "border-rose-50 bg-white hover:border-rose-300 hover:bg-rose-50 bouncy text-gray-700 cursor-pointer shadow-sm" 
                                        : "border-blue-50 bg-white hover:border-teal-300 hover:bg-teal-50 bouncy text-gray-700 cursor-pointer shadow-sm";
                                    icon = <div className={`w-6 h-6 rounded-full border-2 ${isReviewMode ? 'border-gray-300 group-hover:border-rose-400' : 'border-gray-300 group-hover:border-teal-400'}`}></div>;
                                } else {
                                    btnClass += " cursor-default ";
                                    if (isCorrect) {
                                        btnClass += "border-green-400 bg-green-50 text-green-800 shadow-md transform scale-[1.01]";
                                        icon = <div className="flex-shrink-0 w-7 h-7 rounded-full bg-green-500 text-white flex items-center justify-center shadow-sm"><i className="fas fa-check"></i></div>;
                                    } else if (isSelected && !isCorrect) {
                                        btnClass += "border-red-300 bg-red-50 text-red-700 opacity-90";
                                        icon = <div className="flex-shrink-0 w-7 h-7 rounded-full bg-red-400 text-white flex items-center justify-center shadow-sm"><i className="fas fa-times"></i></div>;
                                    } else {
                                        btnClass += "border-gray-100 bg-gray-50 text-gray-400";
                                        icon = <div className="w-6 h-6 rounded-full border-2 border-gray-200"></div>;
                                    }
                                }

                                return (
                                    <button 
                                        key={idx} 
                                        onClick={() => handleSelect(idx)}
                                        className={btnClass}
                                        disabled={showResult}
                                    >
                                        {icon}
                                        <span className="text-base md:text-lg" dangerouslySetInnerHTML={createMarkup(opt)} />
                                    </button>
                                );
                            })}
                        </div>

                        {/* Explanation Box */}
                        {showResult && (
                            <div className="m-5 mt-0 bg-yellow-50 border-2 border-yellow-300 rounded-2xl p-6 relative fade-in">
                                <div className="absolute -top-4 left-6 bg-gradient-to-r from-yellow-400 to-yellow-500 text-white px-5 py-1.5 rounded-full font-bold shadow-md flex items-center gap-2 tracking-wider">
                                    <i className="fas fa-lightbulb"></i> ✨ 觀念大補帖
                                </div>
                                <div className="mt-3 text-gray-800 leading-relaxed text-base md:text-lg">
                                    {selectedIdx === item.ans ? 
                                        <div className="mb-3 font-bold text-green-600 flex items-center gap-2">
                                            <i className="fas fa-party-horn"></i>
                                            {isReviewMode ? "太棒了！你成功克服這題了 🎉" : "太棒了！答對囉 🎉"}
                                        </div> : 
                                        <div className="mb-3 font-bold text-red-500 flex items-center gap-2">
                                            <i className="fas fa-face-thinking"></i>哎呀，再想想看！來看看哪裡卡住了 🤔
                                        </div>
                                    }
                                    <div className="space-y-2 border-t border-yellow-200 pt-3" dangerouslySetInnerHTML={createMarkup(item.exp)} />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('part1');
            const [answers, setAnswers] = useState({});
            const [reviewAnswers, setReviewAnswers] = useState({});
            const [wrongIds, setWrongIds] = useState([]);

            const handleSelect = (qId, idx, isCorrect) => {
                if (activeTab === 'review') {
                    setReviewAnswers(prev => ({ ...prev, [qId]: idx }));
                } else {
                    setAnswers(prev => ({ ...prev, [qId]: idx }));
                    if (!isCorrect) {
                        setWrongIds(prev => prev.includes(qId) ? prev : [...prev, qId]);
                    }
                }
            };

            const resetReview = () => {
                setReviewAnswers({});
            };

            // Scroll to top when switching parts
            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [activeTab]);

            let currentQuestions = [];
            if (activeTab === 'part1') currentQuestions = questions.filter(q => q.part === 1);
            else if (activeTab === 'part2') currentQuestions = questions.filter(q => q.part === 2);
            else if (activeTab === 'review') currentQuestions = questions.filter(q => wrongIds.includes(q.id));

            return (
                <div className="min-h-screen pb-20">
                    <Header />
                    
                    {/* Tab Navigation */}
                    <div className="max-w-3xl mx-auto px-4 mb-8 flex flex-wrap gap-4">
                        <button 
                            onClick={() => setActiveTab('part1')}
                            className={`flex-1 min-w-[100px] py-3 px-4 rounded-2xl font-bold text-base md:text-lg transition-all duration-300 shadow-sm ${activeTab === 'part1' ? 'bg-teal-500 text-white shadow-md transform -translate-y-1' : 'bg-white text-gray-500 hover:bg-teal-50'}`}
                        >
                            第一部份 (1~20)
                        </button>
                        <button 
                            onClick={() => setActiveTab('part2')}
                            className={`flex-1 min-w-[100px] py-3 px-4 rounded-2xl font-bold text-base md:text-lg transition-all duration-300 shadow-sm ${activeTab === 'part2' ? 'bg-teal-500 text-white shadow-md transform -translate-y-1' : 'bg-white text-gray-500 hover:bg-teal-50'}`}
                        >
                            第二部份 (21~40)
                        </button>
                        <button 
                            onClick={() => setActiveTab('review')}
                            className={`flex-1 min-w-[100px] py-3 px-4 rounded-2xl font-bold text-base md:text-lg transition-all duration-300 shadow-sm relative ${activeTab === 'review' ? 'bg-rose-500 text-white shadow-md transform -translate-y-1' : 'bg-white text-gray-500 hover:bg-rose-50'}`}
                        >
                            錯題複習
                            {wrongIds.length > 0 && (
                                <span className="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-black px-2 py-1 rounded-full shadow-md animate-bounce">
                                    {wrongIds.length}
                                </span>
                            )}
                        </button>
                    </div>

                    {/* Question List or Empty State */}
                    {activeTab === 'review' && wrongIds.length === 0 ? (
                        <div className="text-center py-20 bg-white rounded-3xl shadow-sm border border-gray-100 max-w-3xl mx-auto px-4 fade-in">
                            <div className="text-6xl mb-4">🌟</div>
                            <h2 className="text-2xl md:text-3xl font-bold text-teal-600 mb-2">太棒了！目前沒有錯題喔！</h2>
                            <p className="text-gray-500 text-lg">繼續保持，你是理化小天才！</p>
                        </div>
                    ) : (
                        <div className="px-4">
                            {activeTab === 'review' && (
                                <div className="max-w-3xl mx-auto mb-6 flex justify-between items-center fade-in">
                                    <h2 className="text-xl font-bold text-rose-600">
                                        <i className="fas fa-fire mr-2"></i>錯題特訓區
                                    </h2>
                                    <button 
                                        onClick={resetReview}
                                        className="px-4 py-2 bg-rose-100 text-rose-600 rounded-full font-bold hover:bg-rose-200 transition-colors text-sm shadow-sm"
                                    >
                                        <i className="fas fa-redo mr-1"></i> 重新測驗
                                    </button>
                                </div>
                            )}
                            
                            {currentQuestions.map((q, idx) => (
                                <QuestionCard 
                                    key={`${activeTab}-${q.id}`} 
                                    item={q} 
                                    index={idx} 
                                    selectedIdx={activeTab === 'review' ? reviewAnswers[q.id] : answers[q.id]}
                                    onSelect={handleSelect}
                                    isReviewMode={activeTab === 'review'}
                                />
                            ))}
                        </div>
                    )}

                    {/* Footer */}
                    <div className="text-center mt-12 text-gray-400 font-medium pb-8">
                        <p>勇敢挑戰，理化一點都不難！💪</p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
